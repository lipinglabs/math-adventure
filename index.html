<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#FFF3E2" />
<meta name="format-detection" content="telephone=no, email=no, address=no" />
<title>Math Adventure</title>

<!--
  本文件只负责「骨架」，禁止在此写业务逻辑或样式。
  结构：地图屏 / 关卡屏 / 加载遮罩 / 弹层 / 轻提示 / 沙盒热区
  语言：English only，界面不得出现任何中文字符（PROJECT_MATH_RULES §5.5）
  脚本加载顺序是硬约束：数据 → 引擎 → 进度 → 云存档 → 沙盒 → 关卡 → 应用
-->
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Math Adventure" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app" class="app">

  <!-- ============ Map screen ============ -->
  <section id="screen-map" class="screen screen--map is-active" aria-label="Level map">
    <div class="sky" aria-hidden="true">
      <span class="cloud cloud--a"></span>
      <span class="cloud cloud--b"></span>
      <span class="cloud cloud--c"></span>
      <span class="hill hill--back"></span>
      <span class="hill hill--front"></span>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">+</span>
        <span class="brand-text">Math Adventure</span>
      </div>
      <button id="btn-save" class="icon-btn" type="button" aria-label="Cloud save">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M7 18a4.5 4.5 0 0 1-.6-8.96A5.5 5.5 0 0 1 17.2 9.3 4 4 0 0 1 17 17.2"
                fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          <path d="M12 11v6m0 0-2.2-2.2M12 17l2.2-2.2" fill="none"
                stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <div class="map-wrap">
      <!--
        分阶段地图：一屏只放一个「页」（≤6 个节点）。
        每一页自带一条轨迹（path 由 app.js 依节点坐标生成，viewBox 固定 390×620），
        所有页排成一条横向轨道，左右滑动 / 阶段按钮切换。
      -->
      <div id="map-viewport" class="map-viewport">
        <div id="map-track" class="map-track"></div>
      </div>

      <p id="map-note" class="map-note">Tap a level to play</p>

      <div class="map-nav">
        <button id="stage-prev" class="stage-btn" type="button" aria-label="Previous stage">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor"
                  stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="stage-meta">
          <span id="stage-name" class="stage-name">Stage 1</span>
          <span id="stage-dots" class="stage-dots" aria-hidden="true"></span>
        </div>

        <button id="stage-next" class="stage-btn" type="button" aria-label="Next stage">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor"
                  stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 沙盒热区：左上角连点 5 次，见 sandbox.js -->
    <div id="hotspot" class="hotspot" aria-hidden="true"></div>
  </section>

  <!-- ============ Level screen ============ -->
  <section id="screen-level" class="screen screen--level" aria-label="Level">
    <header class="levelbar">
      <button id="btn-back" class="icon-btn" type="button" aria-label="Back to map">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor"
                stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="levelbar-title">
        <span id="level-index" class="level-index">Level 1</span>
        <span id="level-name" class="level-name">Apple Addition</span>
      </div>
      <div id="level-stars" class="level-stars" aria-label="Stars for this level"></div>
    </header>

    <div id="level-dots" class="level-dots" aria-hidden="true"></div>

    <main id="stage" class="stage">
      <!-- 关卡内容由 level-lvNN.js 挂载 -->
    </main>
  </section>

</div>

<!-- ============ Loading overlay ============ -->
<div id="loader" class="loader" hidden role="dialog" aria-modal="true" aria-live="polite">
  <div class="loader-card">
    <div class="loader-art" aria-hidden="true">
      <span class="loader-jar"><span id="loader-fill" class="loader-jar-fill"></span></span>
    </div>
    <h2 id="loader-title" class="loader-title">Loading</h2>
    <div class="loader-bar"><span id="loader-bar-fill" class="loader-bar-fill"></span></div>
    <div class="loader-meta">
      <span id="loader-percent">0%</span>
      <span id="loader-detail">0 / 0</span>
    </div>
    <p id="loader-hint" class="loader-hint">Getting the sounds ready…</p>
    <button id="loader-retry" class="btn btn--ghost" type="button" hidden>Try again</button>
  </div>
</div>

<!-- ============ Modal / toast ============ -->
<div id="modal-root" class="modal-root" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript>Please turn on JavaScript to play.</noscript>

<script src="levels_data.js"></script>
<script src="engine.js"></script>
<script src="progress.js"></script>
<script src="cloud.js"></script>
<script src="sandbox.js"></script>
<script src="level-kit.js"></script>
<script src="level-lv01.js"></script>
<script src="level-lv02.js"></script>
<script src="level-lv03.js"></script>
<script src="level-lv04.js"></script>
<script src="level-lv05.js"></script>
<script src="level-lv06.js"></script>
<script src="level-lv07.js"></script>
<script src="level-lv08.js"></script>
<script src="level-lv09.js"></script>
<script src="level-lv10.js"></script>
<script src="level-lv11.js"></script>
<script src="app.js"></script>
</body>
</html>
